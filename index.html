<!DOCTYPE html>
<html>
  <head>
    <title>Polymod Meta Generator</title>
    <link href="css/stylesheet.css" rel="stylesheet">
    <script src="js/jquery-4.0.0.min.js"></script>
    <script src="js/FileSaver.min.js"></script>
  </head>
  <body>
    <div class="box" style="
      position: absolute;
      width: 60%;
      left: 50%;
      transform: translateX(-50%);
      margin-top: 30px;
      ">
      <h2>Polymod Meta Generator</h2>
      <p>Mod title:</p>
      <input id="title" placeholder="A mod">
      <p>Mod description:</p>
      <input id="desc" placeholder="This is a mod">
      <p>Mod homepage (leave blank to not include):</p>
      <input id="home" placeholder="https://example.com/">
      <p>Mod contributors:</p>
      <div id="contributors"></div>
      <button id="add">+</button>
      <button id="remove">-</button>
      <p>API version:</p>
      <input id="apiVer" placeholder="1.5.0">
      <p>Mod version:</p>
      <input id="modVer" placeholder="1.0.0">
      <p>License (leave blank to not include):</p>
      <input id="license" placeholder="MIT">
      <div style="display: flex; flex-direction: row; align-items: flex-end; margin-bottom: 20px;">
        <input type="checkbox" id="whitespace" checked="true">
        <p>Whitespace</p>
      </div>
      <button id="download">Download</button>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
